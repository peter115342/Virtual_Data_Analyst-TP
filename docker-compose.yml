version: '3.8'

services:
  # Frontend - React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host

  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://admin:admin_password@db:5432/analytics_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FASTAPI_ENV=development
    depends_on:
      - redis
      - db
    command: uv run fastapi dev main.py --host 0.0.0.0 --port 8000

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # PostgreSQL Database (Read-only access for app)
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin_password
      - POSTGRES_DB=analytics_db
    volumes:
      - 2019Nov_clean_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d




volumes:
  redis_data:
  2019Nov_clean_postgres_data:

