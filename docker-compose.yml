version: '3.8'

services:
  # Frontend - React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID}
      - VITE_AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID}
    depends_on:
      - backend

  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=
      - FASTAPI_ENV=development
      - REDIS_URL=redis://redis:6379/0
      # SSH tunnel maps VM MongoDB to host:27017; containers reach host via host.docker.internal
      - MONGODB_URL=mongodb://host.docker.internal:27017
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    command: uv run fastapi dev main.py --host 0.0.0.0 --port 8000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

