# Standalone PostgreSQL Database for testing, docker-compose -f docker-compose.db.yml up -d

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vda-test-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-virtual_data_analyst}
    volumes:
      - vda_test_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vda_test_postgres_data:
