# Standalone MySQL Database for testing, docker-compose -f docker-compose.db_ecommerce.yml up -d

version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: vda-test-db-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-database_name}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - vda_test_mysql_data:/var/lib/mysql
      - ./db/init_db_ecommerce:/docker-entrypoint-initdb.d

    command: --local-infile=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vda_test_mysql_data:
